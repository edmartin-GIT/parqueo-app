{% extends "base.html" %}
{% block title %}{{ titulo }} - Turnos de Parqueo La Guadalupe{% endblock %}
{% block content %}
<h2>{{ titulo }}</h2>
<form method="post" class="formulario angosto">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    {% if volver %}
    <input type="hidden" name="volver_fecha" value="{{ volver.fecha }}">
    <input type="hidden" name="q" value="{{ volver.q }}">
    {% endif %}
    <label>Nombre
        <input type="text" name="nombre" value="{{ datos.nombre or '' }}" maxlength="60" required>
    </label>
    <label>Apellido
        <input type="text" name="apellido" value="{{ datos.apellido or '' }}" maxlength="60" required>
    </label>
    <label>Celular
        <input type="tel" name="celular" value="{{ datos.celular or '' }}" placeholder="(305) 555-0123" required>
    </label>
    <label>Turno (domingo o misa especial)
        <select name="turno" required>
            {% for valor, etiqueta in opciones %}
            <option value="{{ valor }}" {% if valor == turno_actual %}selected{% endif %}>{{ etiqueta }}</option>
            {% endfor %}
        </select>
    </label>
    <label class="check-wa">
        <input type="checkbox" name="acepta_whatsapp" value="1" {% if datos.acepta_whatsapp %}checked{% endif %}>
        <span>Acepta recordatorio por WhatsApp</span>
    </label>
    <button type="submit" class="btn-enviar">Guardar</button>
    <a class="boton-secundario" href="{% if volver %}{{ url_for('admin', fecha=volver.fecha, q=volver.q or None) }}{% else %}{{ url_for('admin') }}{% endif %}">Cancelar</a>
</form>
{% endblock %}
